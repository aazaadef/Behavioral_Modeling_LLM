name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  flake8:
    name: flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install flake8
        # Pinned to the exact version used locally so a flake8 release
        # cannot silently change the lint result between commits.
        run: |
          python -m pip install --upgrade pip
          pip install "flake8==7.3.0"
      - name: Run flake8
        run: flake8 src tests

  black:
    name: black --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install black
        # Pinned to the exact version used locally so a black release
        # cannot silently change formatting rules between commits.
        run: |
          python -m pip install --upgrade pip
          pip install "black==25.11.0"
      - name: Run black --check
        run: black --check src tests
